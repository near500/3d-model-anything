name: iOS unsigned IPA

# 在 GitHub 的 macOS 云机器上构建未签名 IPA。
# 本地不需要 Xcode：构建产物用 Windows 上的 Sideloadly（免费 Apple ID）签名安装。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/house-capture/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-26   # 若镜像不可用或报 runner 错误，改成 macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build unsigned archive
        working-directory: apps/house-capture
        run: |
          xcodebuild archive \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HouseCapture.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload
          cp -r build/HouseCapture.xcarchive/Products/Applications/HouseCapture.app Payload/
          zip -qr "HouseCapture-unsigned-${GITHUB_RUN_NUMBER}.ipa" Payload
          ls -lh "HouseCapture-unsigned-${GITHUB_RUN_NUMBER}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: apps/house-capture/HouseCapture-unsigned-${{ github.run_number }}.ipa
          retention-days: 30
